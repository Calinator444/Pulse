name: API Deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CLIENT_OBJECT_ID: ${{ vars.AZURE_CLIENT_OBJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test API
        working-directory: api
        run: dotnet test Pulse.API.slnx --configuration Release

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infrastructure
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          az group create --name "$AZURE_RESOURCE_GROUP" --location "${{ vars.AZURE_LOCATION || 'eastus' }}"
          az deployment group create \
            --name pulse-api \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file api/infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              githubActionsPrincipalObjectId="$AZURE_CLIENT_OBJECT_ID"
          acr_name=$(az deployment group show \
            --name pulse-api \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.outputs.acrName.value \
            --output tsv)
          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        env:
          ACR_NAME: ${{ steps.infrastructure.outputs.acr_name }}
        run: |
          for attempt in {1..12}; do
            if az acr login --name "$ACR_NAME"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Container registry authorization did not become available."
              exit 1
            fi
            sleep 10
          done
          image="$ACR_NAME.azurecr.io/pulse-api:$GITHUB_SHA"
          docker build --file api/Dockerfile --tag "$image" api
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"
        id: image

      - name: Deploy API image
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          az deployment group create \
            --name pulse-api \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file api/infra/main.bicep \
            --parameters postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD" \
              githubActionsPrincipalObjectId="$AZURE_CLIENT_OBJECT_ID" \
              containerImage="$IMAGE"
