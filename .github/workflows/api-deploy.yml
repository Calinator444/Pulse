name: API Deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/api-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build API
        working-directory: api
        run: dotnet build src/Web/Web.csproj --configuration Release

      - name: Test API unit projects
        working-directory: api
        run: |
          dotnet test tests/Domain.UnitTests/Domain.UnitTests.csproj --configuration Release
          dotnet test tests/Application.UnitTests/Application.UnitTests.csproj --configuration Release

      - name: Publish API
        run: |
          dotnet publish api/src/Web/Web.csproj \
            --configuration Release \
            --no-restore \
            --output api/artifacts/publish
          cd api/artifacts/publish
          zip -q -r ../pulse-api.zip .

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infrastructure
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          az deployment group create \
            --name pulse-api \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file api/infra/main.bicep \
            --parameters location="${{ vars.AZURE_LOCATION || 'eastus' }}" \
              postgresAdminPassword="$POSTGRES_ADMIN_PASSWORD"
          web_app_name=$(az deployment group show \
            --name pulse-api \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.outputs.webAppName.value \
            --output tsv)
          echo "web_app_name=$web_app_name" >> "$GITHUB_OUTPUT"

      - name: Deploy API
        env:
          WEB_APP_NAME: ${{ steps.infrastructure.outputs.web_app_name }}
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$WEB_APP_NAME" \
            --src-path api/artifacts/pulse-api.zip \
            --type zip
